<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>{% block title %}Jobs{% endblock %} · Job dashboard</title>
<style>
body{font:14px/1.5 system-ui,sans-serif;color:#0f1828;background:#f6f7f9;margin:0}
header.top{background:#0f1828;color:#fff;padding:10px 24px;display:flex;gap:20px;align-items:center}
header.top a{color:#fff;text-decoration:none;font-weight:600} main{padding:20px 24px;max-width:1250px;margin:auto}
h1{font-size:20px;margin:0 0 12px} h2{font-size:18px;margin:0} h3{font-size:15px;margin:18px 0 6px}
.muted{color:#667085} .card{background:#fff;border:1px solid #e4e7ec;border-radius:10px;padding:16px 20px;margin:16px 0}
table{border-collapse:collapse;width:100%;background:#fff} th,td{border-bottom:1px solid #eaecf0;padding:6px 8px;text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:#667085}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.met,.ready,.same{background:#dcfae6;color:#067647} .partial,.draft,.other{background:#fef0c7;color:#b54708}
.missing,.uncertain,.not-ready,.no-requirements{background:#fee4e2;color:#b42318} .sent{background:#e0eaff;color:#1849a9}
.prepare_story{background:#dcfae6;color:#067647} .prove_claim{background:#fef0c7;color:#b54708} .gap{background:#fee4e2;color:#b42318}
form.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px} input,select,button{font:inherit;padding:6px 10px;border:1px solid #d0d5dd;border-radius:6px}
button{background:#1849a9;color:#fff;border:0;cursor:pointer} a{color:#1849a9} .quote{color:#475467;font-style:italic}
summary{cursor:pointer;font-weight:600} pre{white-space:pre-wrap;font:13px/1.5 ui-monospace,monospace;background:#f9fafb;padding:12px;border-radius:8px}
</style></head>
<body><header class="top"><a href="/">Jobs</a><a href="/skills">Skills</a><span class="muted">local · 127.0.0.1</span></header>
<main>{% block content %}{% endblock %}</main></body></html>
